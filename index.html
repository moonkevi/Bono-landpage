<!doctype html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Bono app | sign in</title>
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link
         href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Kedebideri:wght@400;700&family=Lato&family=Lexend+Deca:wght@100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:wght@300;400;500;600;700&family=Raleway:ital,wght@0,100..900;1,100..900&family=Young+Serif&display=swap"
         rel="stylesheet"
      />
      <link
         rel="stylesheet"
         href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
         integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
         crossorigin="anonymous"
         referrerpolicy="no-referrer"
      />
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link
         href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Kedebideri:wght@400;700&family=Lato&family=Lexend+Deca:wght@100..900&family=Lobster&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:wght@300;400;500;600;700&family=Raleway:ital,wght@0,100..900;1,100..900&family=Young+Serif&display=swap"
         rel="stylesheet"
      />
      <link rel="icon" href="/images/favicon.jfif" />
      <link rel="stylesheet" href="/css/style.css" />
   </head>
   <body>
      <div class="wrapper">
         <header>
            <p class="logo">bono</p>
            <div class="header-right">
               <span><i class="fa-solid fa-envelope"></i>contact@bono.com</span>
               <span> <i class="fa-solid fa-phone"></i>(+2587763459) </span>
               <a href=""><i class="fa-brands fa-twitter"></i></a>
            </div>
         </header>
         <main class="container">
            <form>
               <div class="form-group">
                  <label for="name">full name</label>
                  <input type="text" name="name" id="name" required />
               </div>
               <div class="form-group">
                  <label for="email">email address</label>
                  <input type="email" name="email" id="email" required />
               </div>
               <div class="form-group">
                  <label for="mssg">message</label>
                  <textarea name="mssg" id="mssg"></textarea>
               </div>
            </form>
            <div class="content">
               <h1>comming soon for every developer</h1>
               <p>
                  Our new bono site will change the way you think about content
                  management and wil allow you to focus on what is important.
                  Use the contact form to send us your thoughts.
               </p>
            </div>
         </main>
      </div>
   </body>
</html>
